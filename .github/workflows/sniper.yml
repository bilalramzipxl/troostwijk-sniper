name: sniper
# Cron is UTC. Local (Amsterdam, CET) = UTC + 1. Auction lots close 5 Nov 10:00-12:08 local.
on:
  schedule:
    - cron: "0 19 1-3 11 *"          # 1-3 Nov: once a day at 20:00 local
    - cron: "0 8,12,16,19 4 11 *"    # 4 Nov: 09:00 13:00 17:00 20:00 local
    - cron: "*/15 6-8 5 11 *"        # 5 Nov 07:00-09:59 local: every 15 min
    - cron: "*/5 9-10 5 11 *"        # 5 Nov 10:00-11:59 local: every 5 min
    - cron: "0-10/5 11 5 11 *"       # 5 Nov 12:00-12:10 local: every 5 min
  workflow_dispatch:
concurrency:
  group: sniper
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TZ: Europe/Amsterdam
      PYTHONUTF8: "1"
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            details_cache.json
            prices_cache.json
            alerted.json
          key: sniper-state-${{ github.run_id }}
          restore-keys: sniper-state-
      - run: python sniper.py --once --each-run --window 1000
